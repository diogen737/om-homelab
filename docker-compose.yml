services:
  # ================================================
  # Network
  # ================================================

  netbird-client:
    image: netbirdio/netbird:0.83.1@sha256:3c9d68ae8b730aaed841ff5374e3efad8be550099871a52b1a653d30e5f4faf2
    container_name: netbird-client
    hostname: om-routing-peer
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required when using userspace mode or when kernel module is not available
      - /dev/net/tun
    network_mode: host
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY}
    volumes:
      - netbird-client:/var/lib/netbird
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "netbird status --check ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.17.0@sha256:9cdfebbcbb6a70b84c538e6e39862c5d627171e5f4ea4bfda933f7643e3640a4
    container_name: nginx-proxy-manager
    environment:
      TZ: ${TZ}
    ports:
      - 80:80
      - 443:443
    volumes:
      - /srv/nginx-proxy-manager/data:/data
      - /srv/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - homelab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"] # script bundled in the image
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ================================================
  # Immich
  # https://docs.immich.app/install/docker-compose
  # https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
  # ================================================

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    extends:
      file: config/hwaccel.transcoding.yml
      service: vaapi # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of IMMICH_UPLOAD_LOCATION in the .env file
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      UPLOAD_LOCATION: ${IMMICH_UPLOAD_LOCATION}
      DB_DATA_LOCATION: ${IMMICH_DB_DATA_LOCATION}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
    depends_on:
      - redis
      - database
    networks:
      - homelab-network
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: config/hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    networks:
      - homelab-network
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - homelab-network
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of IMMICH_DB_DATA_LOCATION in the .env file
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - homelab-network
    restart: always
    healthcheck:
      disable: false

  # ================================================
  # openGym
  # https://github.com/DuarteSantos8/openGym/blob/main/docker-compose.yml
  # ================================================

  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.4@sha256:7508ecca4ae16a917e6e58e3fd40961fbdf7d5fbfc54b7e6f434f741ddf41402
    container_name: opengym-api
    restart: unless-stopped
    environment:
      RP_ID: ${OPENGYM_RP_ID}
      RP_NAME: ${OPENGYM_RP_NAME}
      ORIGIN: ${OPENGYM_ORIGIN}
      PORT: ${OPENGYM_PORT}
      DATA_DIR: /data
      TRUST_PROXY: 1
    volumes:
      - /srv/open-gym/data:/data # users, passkeys, per-user state, session secret — BACK THIS UP
                                 # (and uploads/: the photos and videos of custom exercises)
      # Provider credential cache (Codex). A sibling of ./data on purpose: the documented backup
      # is `tar czf … data/`, and a live refresh token must not end up inside it. Nothing here
      # needs backing up — if you lose it, sign the provider in again.
      - /srv/open-gym/coach-auth:/coach-auth
    networks:
      - opengym-network

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise animations, which are part of the image. Single origin for passkeys.
  opengym-web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.4@sha256:33575782762f6cc9181f5e33616d55bf718bcd56338b714f22cb5d01e1adc278
    container_name: opengym-web
    restart: unless-stopped
    depends_on:
      opengym-api:
        condition: service_started
    environment:
      NGINX_PORT: ${OPENGYM_NGINX_PORT}
      PORT: ${OPENGYM_PORT}
      BACKEND: opengym-api
      RESOLVER: 127.0.0.11
      MEDIA_UPLOAD_MAX: 48m
    networks:
      - homelab-network
      - opengym-network

  # ================================================
  # affine
  # https://github.com/DuarteSantos8/openGym/blob/main/docker-compose.yml
  # ================================================

  affine:
    image: ghcr.io/toeverything/affine:stable@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    container_name: affine_server
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    volumes:
      - /srv/affine/storage:/root/.affine/storage
      - ./affine:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=affine-redis
      - DATABASE_URL=postgresql://affine@affine-postgres:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    restart: unless-stopped
    networks:
      - affine-network
      - homelab-network

  affine-migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_migration_job
    volumes:
      - /srv/affine:/root/.affine/storage
      - ./affine:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - REDIS_SERVER_HOST=affine-redis
      - DATABASE_URL=postgresql://affine@affine-postgres:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
    networks:
      - affine-network

  affine-redis:
    image: redis@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    container_name: affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - affine-network

  affine-postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    container_name: affine_postgres
    volumes:
      - /srv/affine/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - affine-network

  # ================================================
  # Monitoring
  # ================================================

  beszel:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    restart: unless-stopped
    networks:
      - homelab-network
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    environment:
      APP_URL: https://monitor.om-homelab.duckdns.org
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 10s
      timeout: 5s

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2-alpine@sha256:2ea69d4c9a6690d07368d50762cf606281d96b447cdd411855c87ff4027465d9
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    devices:
      - /dev/sda:/dev/sda
      - /dev/nvme0:/dev/nvme0
    cap_add:
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      HUB_URL: https://monitor.om-homelab.duckdns.org

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    container_name: homepage
    volumes:
      - ./homepage/config:/app/config
      - ./homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
      - /mnt/jellyfin-media:/mnt/jellyfin-media:ro
      - /mnt/backups:/mnt/backups:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: om-homelab.duckdns.org # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      HOMEPAGE_EXTERNAL_URL: https://om-homelab.duckdns.org
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY}
      HOMEPAGE_VAR_IMMICH_KEY: ${HOMEPAGE_VAR_IMMICH_KEY}
      HOMEPAGE_VAR_NPM_USER: ${HOMEPAGE_VAR_NPM_USER}
      HOMEPAGE_VAR_NPM_PASSWORD: ${HOMEPAGE_VAR_NPM_PASSWORD}
    networks:
      - homelab-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/healthcheck || exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ================================================
  # Other apps
  # ================================================

  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - 992
    ports:
      - 127.0.0.1:8096:8096/tcp
      - 127.0.0.1:8920:8920/tcp
      - 127.0.0.1:7359:7359/udp
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/jellyfin/cache:/cache
      - /mnt/jellyfin-media:/media:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      - homelab-network
    restart: unless-stopped

  convertx:
    image: ghcr.io/c4illin/convertx:v0.20.0@sha256:6259e0c1e063120b1ddbc6937372a83be58182b2c9dc82264f58e100907b3e51
    container_name: convertx
    restart: unless-stopped
    environment:
      HTTP_ALLOWED: true
      PUID: 1000
    volumes:
      - /srv/convertx:/app/data
    networks:
      - homelab-network

# ================================================

volumes:
  model-cache:
  netbird-client:
  beszel-data:
  beszel-socket:
  beszel-agent-data:

networks:
  opengym-network:
    name: opengym-network
    external: true
  homelab-network:
    name: homelab-network
    external: true
  affine-network:
    name: affine-network
    external: true
