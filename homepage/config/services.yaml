---

- Services:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://theater.om-homelab.duckdns.org
        description: Media server
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: false

    - Immich:
        icon: immich.svg
        href: http://photos.om-homelab.duckdns.org
        description: Photos & videos
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.svg
        href: https://nginx.om-homelab.duckdns.org
        description: Reverse proxy
        widget:
          type: npm
          url: http://nginx-proxy-manager:81
          username: {{HOMEPAGE_VAR_NPM_USER}}
          password: {{HOMEPAGE_VAR_NPM_PASSWORD}}

    - Beszel:
        icon: beszel.svg
        href: https://monitor.om-homelab.duckdns.org/system/fuz0qowseyzvvgm
        description: Server monitoring
        siteMonitor: http://beszel:8090

    - ConvertX:
        icon: mdi-file-swap-outline
        href: https://convert.om-homelab.duckdns.org
        description: File converter
        siteMonitor: http://convertx:3000

    - NetBird:
        icon: netbird.svg
        description: VPN client
        server: my-docker
        container: netbird-client

# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

