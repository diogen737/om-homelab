---
- datetime:
    text_size: xl
    locale: de
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23

- openmeteo:
    label: Munich
    latitude: 48.1351
    longitude: 11.5820
    timezone: Europe/Berlin
    units: metric
    cache: 5

- resources:
    label: System
    cpu: true
    memory: true
    disk: /
    expanded: true

- resources:
    label: Media
    disk: /mnt/jellyfin-media
    expanded: true

- resources:
    label: Backup
    disk: /mnt/backups
    expanded: true

